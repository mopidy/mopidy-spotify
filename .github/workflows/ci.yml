name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# No permissions by default; each job requests what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Check out the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1

  main:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "pytest (3.13-lowest)"
            python: "3.13"
            tox: "3.13-lowest"
          - name: "pytest (3.13)"
            python: "3.13"
            tox: "3.13"
          - name: "pytest (3.14)"
            python: "3.14"
            tox: "3.14"
          - name: "pytest (3.15)"
            python: "3.15"
            tox: "3.15"
            coverage: true
          - name: "pyright"
            python: "3.15"
            tox: "pyright"
          - name: "ruff check"
            python: "3.15"
            tox: "ruff-check"
          - name: "ruff format"
            python: "3.15"
            tox: "ruff-format"

    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Deliberately unpinned: this is our own image, and we always want the
    # latest version of it.
    container: ghcr.io/mopidy/ci:latest # zizmor: ignore[unpinned-images]
    permissions:
      contents: read # Check out the repository.
    env:
      PYTHON: ${{ matrix.python }}
      TOX_ENV: ${{ matrix.tox }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install "$PYTHON"
      - run: uvx --python "$PYTHON" --with tox-uv tox -e "$TOX_ENV"
        if: ${{ ! matrix.coverage }}
      - run: uvx --python "$PYTHON" --with tox-uv tox -e "$TOX_ENV" -- --cov-report=xml
        if: ${{ matrix.coverage }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ matrix.coverage }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
